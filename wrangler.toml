# Cloudflare Workers & Pages Configuration for finite.bhutadamarasena.com
name = "finite-dimensional-modular-theory-v6-5-final"
compatibility_date = "2024-10-01"

# Cloudflare Pages Static Output Directory
pages_build_output_dir = "dist"

# Cloudflare Workers with Static Assets (enables both `wrangler deploy` and `wrangler pages deploy`)
